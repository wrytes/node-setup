version: '3.5'

networks:
    default:
        driver: overlay
    frontend:
        driver: overlay

volumes:
    portainer_data:

services:
    agent:
        image: portainer/agent:2.21.5
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes
        networks:
            - default
        deploy:
            mode: global
            placement:
                constraints: [node.platform.os == linux]

    portainer:
        image: portainer/portainer-ce:2.21.5
        command: -H tcp://tasks.agent:9001 --tlsskipverify
        environment:
            - LETSENCRYPT_HOST=portainer.wrytes.io
            - VIRTUAL_HOST=portainer.wrytes.io
            - VIRTUAL_PORT=9000
        volumes:
            - portainer_data:/data
        networks:
            - default
            - reverse-proxy_frontend
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]
