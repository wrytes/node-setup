services:
    app:
        image: bbtsoftwareag/nginx-proxy-unrestricted-requestsize:alpine
        labels:
            - 'com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy'
        volumes:
            - nginx-vhost-vol:/etc/nginx/vhost.d
            - nginx-share-vol:/usr/share/nginx/html
            - nginx-certs-vol:/etc/nginx/certs
            - acme:/etc/acme.sh
            - /var/run/docker.sock:/tmp/docker.sock:ro
        ports:
            - target: 80
              published: 80
              mode: host
            - target: 443
              published: 443
              mode: host
        networks:
            - default
            - portainer_frontend

    letsencrypt:
        image: jrcs/letsencrypt-nginx-proxy-companion:2.2
        depends_on:
            - app
        volumes:
            - nginx-vhost-vol:/etc/nginx/vhost.d
            - nginx-share-vol:/usr/share/nginx/html
            - nginx-certs-vol:/etc/nginx/certs
            - acme:/etc/acme.sh
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            - DEFAULT_EMAIL=${DEFAULT_EMAIL}
        networks:
            - default

volumes:
    nginx-vhost-vol:
    nginx-share-vol:
    nginx-certs-vol:
    acme:

networks:
    default:
        driver: overlay
    portainer_frontend:
        external: true
