services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-umami}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-umami}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-umami}']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

    app:
        image: ghcr.io/umami-software/umami:3.1
        environment:
            - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
            - VIRTUAL_HOST=${VIRTUAL_HOST}
            - VIRTUAL_PORT=${VIRTUAL_PORT:-3000}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-umami}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-umami}
            - APP_SECRET=${APP_SECRET}
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost:${VIRTUAL_PORT:-3000}/api/heartbeat || exit 1']
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 60s
        depends_on:
            - postgres
        networks:
            - backend
            - frontend
        deploy:
            replicas: 1
            update_config:
                order: start-first
                failure_action: rollback
            restart_policy:
                condition: on-failure

volumes:
    postgres_data:

networks:
    backend:
        driver: overlay
    frontend:
        driver: overlay
        attachable: true
