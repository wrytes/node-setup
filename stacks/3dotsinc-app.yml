services:
    app:
        image: node:22
        command:
            bash -c "git clone --depth=1 https://github.com/wrytes/3dotsinc-app.git /app
            && cd /app && yarn install --frozen-lockfile && yarn run build && yarn run start"
        environment:
            - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
            - VIRTUAL_HOST=${VIRTUAL_HOST}
            - VIRTUAL_PORT=${VIRTUAL_PORT}
        networks:
            - frontend
        restart: unless-stopped

networks:
    frontend:
        driver: overlay
