services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-wrytes}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

    redis:
        image: redis:7-alpine
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - backend
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

    api:
        image: node:22
        command: bash -c "
            git clone --depth=1 https://github.com/wrytes/wrytes-api.git /app &&
            cd /app &&
            yarn install --frozen-lockfile &&
            yarn run build &&
            yarn run start:prod"
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -f http://localhost:${VIRTUAL_PORT:-3030} || exit 1',
                ]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 120s
        deploy:
            replicas: 1
            update_config:
                order: start-first
                failure_action: rollback
            restart_policy:
                condition: on-failure
        environment:
            - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
            - VIRTUAL_HOST=${VIRTUAL_HOST}
            - VIRTUAL_PORT=${VIRTUAL_PORT:-3030}
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wrytes}
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            - JWT_SECRET=${JWT_SECRET}
            - NODE_ENV=production
        depends_on:
            - postgres
            - redis
        networks:
            - backend
            - frontend

volumes:
    postgres_data:
    redis_data:

networks:
    backend:
        driver: overlay
    frontend:
        driver: overlay
        attachable: true
